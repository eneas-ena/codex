<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CODEX">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<title>CODEX — Python</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">

<style>
:root{
  --tinta:#0F1B33; --tinta-alta:#16243F; --tinta-baixa:#0A1326;
  --linha:#24344F; --ouro:#C9A227; --ouro-fraco:#8A701A;
  --pergaminho:#E8E4D9; --neblina:#93A1B8;
  --verde:#74C39A; --verde-fundo:rgba(116,195,154,.10);
  --rubro:#E8837E; --rubro-fundo:rgba(232,131,126,.10);
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --serif:"Cormorant Garamond",Georgia,serif;
  --display:"Cinzel",serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--tinta);color:var(--pergaminho);
  font-family:var(--serif);font-size:18px;line-height:1.6;
  display:flex;flex-direction:column;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit}
a{color:var(--ouro)}

/* ---------------- Cabeçalho ---------------- */
header{
  display:flex;align-items:center;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 18px 10px;
  border-bottom:1px solid var(--linha);background:var(--tinta-baixa);
  position:sticky;top:0;z-index:20;
}
.lampada{width:12px;height:12px;border-radius:50%;background:var(--linha);border:1px solid var(--ouro-fraco);flex:none;transition:background .3s,box-shadow .3s}
body[data-motor="carregando"] .lampada{background:var(--ouro-fraco);animation:pulsar 1.5s ease-in-out infinite}
body[data-motor="pronto"] .lampada{background:var(--ouro);box-shadow:0 0 10px rgba(201,162,39,.5)}
body[data-motor="rodando"] .lampada{background:var(--verde);box-shadow:0 0 10px rgba(116,195,154,.5);animation:pulsar .9s ease-in-out infinite}
body[data-motor="falha"] .lampada{background:var(--rubro)}
@keyframes pulsar{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.lampada{animation:none!important}}

.titulo-topo{font-family:var(--display);font-size:15px;letter-spacing:.16em;font-weight:600;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voltar{background:none;border:0;color:var(--neblina);font-size:22px;cursor:pointer;padding:0 6px;line-height:1}
.voltar:hover{color:var(--ouro)}
.nota-topo{font-size:14px;color:var(--neblina);font-style:italic;white-space:nowrap}
@media (max-width:620px){.nota-topo{display:none}}

/* ---------------- Estrutura ---------------- */
#app{flex:1;min-height:0;overflow-y:auto;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.folha{max-width:760px;margin:0 auto;padding:26px 20px 0}
.folha.larga{max-width:920px}

h2.secao{font-family:var(--display);font-size:22px;letter-spacing:.06em;font-weight:600;margin:0 0 4px}
p.legenda{color:var(--neblina);font-style:italic;margin:0 0 26px}

/* ---------------- Aviso ---------------- */
.faixa{padding:10px 18px;background:rgba(232,131,126,.12);border-bottom:1px solid rgba(232,131,126,.3);
  color:var(--rubro);font-size:15px;font-style:italic;text-align:center}

/* ---------------- PIN ---------------- */
.pin-caixa{max-width:360px;margin:12vh auto 0;padding:0 24px;text-align:center}
.pin-caixa h2{font-family:var(--display);font-size:20px;letter-spacing:.12em;margin:0 0 8px}
.pin-caixa p{color:var(--neblina);font-style:italic;margin:0 0 26px;font-size:16px}
#pin{width:100%;text-align:center;font-family:var(--mono);font-size:30px;letter-spacing:.5em;
  padding:14px 0 14px .5em;background:var(--tinta-alta);border:1px solid var(--linha);
  border-radius:8px;color:var(--pergaminho);outline:none}
#pin:focus{border-color:var(--ouro)}
.pin-erro{color:var(--rubro);font-size:15px;font-style:italic;min-height:22px;margin-top:12px}

/* ---------------- Cartões da trilha ---------------- */
.cartao{
  display:block;width:100%;text-align:left;
  background:var(--tinta-alta);border:1px solid var(--linha);border-left:3px solid var(--linha);
  border-radius:8px;padding:16px 18px;margin-bottom:12px;cursor:pointer;color:inherit;
  transition:border-color .2s,transform .15s;
}
.cartao:hover:not(:disabled){border-color:var(--ouro-fraco);border-left-color:var(--ouro);transform:translateX(2px)}
.cartao:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
.cartao[data-estado="concluida"]{border-left-color:var(--verde)}
.cartao[data-estado="andamento"]{border-left-color:var(--ouro)}
.cartao:disabled{opacity:.42;cursor:not-allowed}
.cartao .numero{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--ouro-fraco);text-transform:uppercase}
.cartao h3{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.03em;margin:5px 0 5px}
.cartao p{margin:0;color:var(--neblina);font-size:16px;font-style:italic}
.cartao .rodape{display:flex;justify-content:space-between;align-items:center;margin-top:12px;
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--neblina)}
.barra{height:3px;background:var(--linha);border-radius:2px;margin-top:9px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--ouro);transition:width .4s}
.cartao[data-estado="concluida"] .barra i{background:var(--verde)}

.futuro{margin-top:30px;padding-top:18px;border-top:1px solid var(--linha)}

/* ---------------- Módulos ---------------- */
.modulo{margin-bottom:14px}
.cabeca-modulo{display:block;width:100%;text-align:left;background:var(--tinta-baixa);
  border:1px solid var(--linha);border-radius:8px;padding:16px 18px;cursor:pointer;color:inherit;
  transition:border-color .2s}
.cabeca-modulo:hover:not(:disabled){border-color:var(--ouro-fraco)}
.cabeca-modulo:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
.cabeca-modulo:disabled{opacity:.4;cursor:not-allowed}
.cabeca-modulo .numero{font-family:var(--mono);font-size:11px;letter-spacing:.16em;
  color:var(--ouro);text-transform:uppercase}
.cabeca-modulo h3{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.05em;margin:6px 0 5px}
.cabeca-modulo p{margin:0;color:var(--neblina);font-size:16px;font-style:italic}
.cabeca-modulo .rodape{display:flex;justify-content:space-between;align-items:center;margin-top:12px;
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--neblina)}
.cabeca-modulo .seta{color:var(--ouro)}
.modulo[data-estado="concluido"] .cabeca-modulo{border-color:rgba(116,195,154,.4)}
.modulo .licoes{padding:12px 0 4px 16px;border-left:1px solid var(--linha);margin-left:18px}
.futuro span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:#3E5170;margin-bottom:10px}
.futuro li{color:#3E5170;font-style:italic;list-style:none;padding:3px 0}
.futuro ul{margin:0;padding:0}

/* ---------------- Passos ---------------- */
.passos{display:flex;gap:0;border-bottom:1px solid var(--linha);margin:0 0 26px}
.passos button{flex:1;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--neblina);font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;padding:11px 4px;cursor:pointer}
.passos button[aria-selected="true"]{color:var(--ouro);border-bottom-color:var(--ouro)}
.passos button:disabled{opacity:.35;cursor:not-allowed}

/* ---------------- Blocos do conceito ---------------- */
.bloco-texto{margin:0 0 20px}
.bloco-aviso{margin:0 0 22px;padding:14px 18px;border-left:2px solid var(--ouro);
  background:rgba(201,162,39,.06);color:var(--pergaminho);font-style:italic}
.exemplo{margin:0 0 22px;border:1px solid var(--linha);border-radius:8px;overflow:hidden;background:var(--tinta-baixa)}
.exemplo pre{margin:0;padding:14px 16px;font-family:var(--mono);font-size:13.5px;line-height:1.7;
  white-space:pre-wrap;word-break:break-word;color:var(--pergaminho);overflow-x:auto}
.exemplo .nota{padding:10px 16px;border-top:1px solid var(--linha);color:var(--neblina);
  font-size:15.5px;font-style:italic}
.exemplo .barra-exemplo{display:flex;justify-content:flex-end;padding:7px 10px;border-top:1px solid var(--linha)}
.exemplo .mini{background:none;border:1px solid var(--linha);color:var(--neblina);border-radius:5px;
  padding:4px 12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.exemplo .mini:hover{border-color:var(--ouro);color:var(--ouro)}
.mini-saida{margin:0;padding:10px 16px;border-top:1px solid var(--linha);background:var(--tinta);
  font-family:var(--mono);font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--verde)}
.mini-saida.ruim{color:var(--rubro)}

/* Destaque de sintaxe estático */
.tk-key{color:#E4A6C8}.tk-str{color:var(--verde)}.tk-num{color:#F0B87A}
.tk-com{color:#5C6E8C;font-style:italic}.tk-fun{color:#8FC5F0}

/* ---------------- Editor ---------------- */
.moldura{border:1px solid var(--linha);border-radius:8px;overflow:hidden;margin-bottom:14px;background:var(--tinta-baixa)}
.moldura .cabeca{display:flex;justify-content:space-between;align-items:center;padding:7px 14px;
  border-bottom:1px solid var(--linha);font-family:var(--mono);font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--neblina)}
.CodeMirror{height:auto!important;min-height:150px;font-family:var(--mono)!important;font-size:14px;
  line-height:1.7;background:var(--tinta-baixa);color:var(--pergaminho);padding:6px 0}
.cm-s-vidas .CodeMirror-gutters{background:var(--tinta-baixa);border-right:1px solid var(--linha)}
.cm-s-vidas .CodeMirror-linenumber{color:#3E5170;font-size:12px}
.cm-s-vidas .CodeMirror-cursor{border-left:2px solid var(--ouro)}
.cm-s-vidas .CodeMirror-selected{background:rgba(201,162,39,.18)}
.cm-s-vidas .CodeMirror-activeline-background{background:rgba(255,255,255,.03)}
.cm-s-vidas .cm-keyword{color:#E4A6C8;font-weight:500}
.cm-s-vidas .cm-builtin{color:#8FC5F0}
.cm-s-vidas .cm-def{color:var(--ouro)}
.cm-s-vidas .cm-variable{color:var(--pergaminho)}
.cm-s-vidas .cm-variable-2{color:#B8CDE8}
.cm-s-vidas .cm-string{color:var(--verde)}
.cm-s-vidas .cm-number{color:#F0B87A}
.cm-s-vidas .cm-comment{color:#5C6E8C;font-style:italic}
.cm-s-vidas .cm-operator{color:var(--neblina)}
textarea.simples{width:100%;min-height:170px;background:var(--tinta-baixa);color:var(--pergaminho);
  border:0;resize:vertical;padding:12px 14px;font-family:var(--mono);font-size:14px;line-height:1.7;outline:none;display:block}

.simbolos{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;border-top:1px solid var(--linha);
  background:var(--tinta-alta);scrollbar-width:none}
.simbolos::-webkit-scrollbar{display:none}
.simbolos button{flex:none;min-width:38px;height:36px;padding:0 9px;background:var(--tinta-baixa);
  border:1px solid var(--linha);border-radius:7px;color:var(--pergaminho);font-family:var(--mono);
  font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.simbolos button:active{background:var(--ouro-fraco)}
.simbolos .setas{border-color:var(--ouro-fraco);color:var(--ouro)}

/* ---------------- Botões ---------------- */
.acoes{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
button.acao{font-family:var(--display);font-size:12.5px;letter-spacing:.1em;padding:10px 20px;
  border-radius:6px;cursor:pointer;border:1px solid var(--ouro-fraco);background:transparent;color:var(--ouro);
  transition:background .2s,opacity .2s}
button.acao:hover:not(:disabled){background:rgba(201,162,39,.12)}
button.acao:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
button.acao:disabled{opacity:.35;cursor:not-allowed}
button.acao.principal{background:var(--ouro);color:var(--tinta);border-color:var(--ouro);font-weight:600}
button.acao.principal:hover:not(:disabled){background:#DCB43A}
button.acao.discreta{border-color:var(--linha);color:var(--neblina)}
button.acao.discreta:hover:not(:disabled){background:rgba(255,255,255,.05);color:var(--pergaminho)}
.espaco{margin-left:auto}

/* ---------------- Exercícios ---------------- */
.pontos{display:flex;gap:7px;align-items:center;margin-bottom:20px}
.pontos i{width:9px;height:9px;border-radius:50%;background:var(--linha);display:block}
.pontos i.feito{background:var(--verde)}
.pontos i.atual{background:var(--ouro);transform:scale(1.35)}
.pontos em{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  color:var(--neblina);font-style:normal}

.enunciado{font-size:19px;margin:0 0 18px}
.esperado-caixa{border:1px dashed var(--ouro-fraco);border-radius:8px;padding:12px 16px;margin-bottom:18px;background:rgba(201,162,39,.05)}
.esperado-caixa span{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ouro-fraco);margin-bottom:7px}
.esperado-caixa pre{margin:0;font-family:var(--mono);font-size:13.5px;line-height:1.7;
  white-space:pre-wrap;word-break:break-word;color:var(--pergaminho)}

.opcao{display:block;width:100%;text-align:left;background:var(--tinta-alta);border:1px solid var(--linha);
  border-radius:8px;padding:13px 16px;margin-bottom:9px;color:var(--pergaminho);font-family:var(--mono);
  font-size:14px;cursor:pointer;transition:border-color .18s,background .18s}
.opcao:hover:not(:disabled){border-color:var(--ouro-fraco)}
.opcao[aria-pressed="true"]{border-color:var(--ouro);background:rgba(201,162,39,.10)}
.opcao.certa{border-color:var(--verde);background:var(--verde-fundo)}
.opcao.errada{border-color:var(--rubro);background:var(--rubro-fundo)}
.opcao:disabled{cursor:default}

/* ---------------- Retorno ---------------- */
.retorno{border-radius:8px;padding:16px 18px;margin-bottom:18px;border:1px solid var(--linha)}
.retorno.bom{border-color:rgba(116,195,154,.45);background:var(--verde-fundo)}
.retorno.mau{border-color:rgba(232,131,126,.4);background:var(--rubro-fundo)}
.retorno h4{font-family:var(--display);font-size:14px;letter-spacing:.1em;margin:0 0 9px;font-weight:600}
.retorno.bom h4{color:var(--verde)}
.retorno.mau h4{color:var(--rubro)}
.retorno p{margin:0 0 6px;font-size:17px}
.retorno pre{margin:8px 0 0;font-family:var(--mono);font-size:13px;line-height:1.65;
  white-space:pre-wrap;word-break:break-word;color:var(--rubro)}
.glosa{margin:12px 0 0;padding:9px 0 9px 14px;border-left:2px solid var(--ouro);color:var(--ouro);font-style:italic;font-size:16.5px}

.testes{width:100%;border-collapse:collapse;margin-top:12px;font-family:var(--mono);font-size:12.5px}
.testes th{text-align:left;font-weight:400;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--neblina);padding:0 10px 7px 0;border-bottom:1px solid var(--linha)}
.testes td{padding:8px 10px 8px 0;border-bottom:1px solid var(--linha);vertical-align:top;
  white-space:pre-wrap;word-break:break-word}
.testes td.marca{width:20px;font-size:14px}
.testes tr.ok td.marca{color:var(--verde)}
.testes tr.nao td.marca{color:var(--rubro)}
.testes td.obtido{color:var(--rubro)}
.testes tr.ok td.obtido{color:var(--verde)}

.saida-caixa{margin:0 0 18px;border:1px solid var(--linha);border-radius:8px;overflow:hidden}
.saida-caixa span{display:block;padding:7px 14px;border-bottom:1px solid var(--linha);background:var(--tinta-baixa);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--neblina)}
.saida-caixa pre{margin:0;padding:12px 14px;font-family:var(--mono);font-size:13.5px;line-height:1.7;
  white-space:pre-wrap;word-break:break-word;min-height:44px}
.saida-caixa pre .err{color:var(--rubro)}
.saida-caixa pre .vazio{color:#3E5170;font-family:var(--serif);font-style:italic;font-size:16px}

/* ---------------- Conclusão ---------------- */
.fim{text-align:center;padding:8vh 0 0}
.fim .selo{font-family:var(--display);font-size:44px;color:var(--ouro);letter-spacing:.1em}
.fim h3{font-family:var(--display);font-size:20px;letter-spacing:.08em;margin:16px 0 8px}
.fim p{color:var(--neblina);font-style:italic;margin:0 0 28px}

footer{padding:9px 18px calc(9px + env(safe-area-inset-bottom));border-top:1px solid var(--linha);
  background:var(--tinta-baixa);font-family:var(--mono);font-size:10px;letter-spacing:.05em;
  color:#3E5170;display:flex;gap:16px;flex-wrap:wrap}
</style>
</head>

<body data-motor="carregando">

<header>
  <button class="voltar" id="btnVoltar" style="display:none" aria-label="Voltar">‹</button>
  <span class="lampada" aria-hidden="true"></span>
  <span class="titulo-topo" id="tituloTopo">CODEX</span>
  <span class="nota-topo" id="notaTopo">iniciando…</span>
</header>

<div id="app"></div>

<footer>
  <span id="diagMotor">motor: —</span>
  <span id="diagBanco">banco: —</span>
</footer>


<!-- ===================== Worker do Python ===================== -->
<script id="fonteWorker" type="text/plain">
const BUILDS = [
  "https://cdn.jsdelivr.net/pyodide/v314.0.3/full/",
  "https://cdn.jsdelivr.net/pyodide/v0.28.3/full/"
];

let py = null;
let prontoPromise = null;

function avisar(tipo, dados){ self.postMessage(Object.assign({ tipo }, dados || {})); }

const PREPARO = `
import builtins, sys, json, io, contextlib, linecache, traceback

def _sem_input(prompt=''):
    raise RuntimeError('Neste laboratorio nao usamos input(). Guarde o valor direto numa variavel.')

builtins.input = _sem_input

def _registrar(_fonte):
    linecache.cache['codigo.py'] = (len(_fonte), None, _fonte.splitlines(True), 'codigo.py')

def _limpar(_texto):
    return '\\n'.join([_l.rstrip() for _l in str(_texto).strip().split('\\n')])

def _formatar(_e):
    _tb = _e.__traceback__.tb_next
    return ''.join(traceback.TracebackException(type(_e), _e, _tb).format())

def _executar(_fonte):
    _registrar(_fonte)
    _amb = {'__name__': '__main__'}
    try:
        _obj = compile(_fonte, 'codigo.py', 'exec')
    except SyntaxError as _e:
        return ''.join(traceback.format_exception_only(type(_e), _e))
    try:
        exec(_obj, _amb)
    except SystemExit:
        return None
    except BaseException as _e:
        return _formatar(_e)
    return None

def _corrigir(_fonte, _testes_json):
    _registrar(_fonte)
    try:
        _testes = json.loads(_testes_json)
    except Exception:
        _testes = []
    _amb = {'__name__': '__main__'}
    _saida = io.StringIO()
    try:
        _obj = compile(_fonte, 'codigo.py', 'exec')
    except SyntaxError as _e:
        return json.dumps({'erro': ''.join(traceback.format_exception_only(type(_e), _e)), 'impresso': '', 'testes': []})
    try:
        with contextlib.redirect_stdout(_saida):
            exec(_obj, _amb)
    except BaseException as _e:
        return json.dumps({'erro': _formatar(_e), 'impresso': _saida.getvalue(), 'testes': []})
    _resultados = []
    for _t in _testes:
        _item = {'rotulo': _t.get('rotulo') or _t.get('chamada') or 'saida do programa',
                 'esperado': '', 'obtido': '', 'ok': False, 'erro': None, 'detalhe': None}
        try:
            if _t.get('tipo') == 'saida':
                _esp = _limpar(_t.get('esperado', ''))
                _obt = _limpar(_saida.getvalue())
                _item['esperado'] = _esp
                _item['obtido'] = _obt if _obt else '(nada foi impresso)'
                _item['ok'] = (_obt == _esp)
                if not _item['ok']:
                    _le = _esp.split('\\n')
                    _lo = _obt.split('\\n')
                    if len(_le) != len(_lo):
                        _item['detalhe'] = 'Esperava ' + str(len(_le)) + ' linha(s) e recebeu ' + str(len(_lo)) + '.'
                    else:
                        for _k in range(len(_le)):
                            if _le[_k] != _lo[_k]:
                                _item['detalhe'] = 'A diferença está na linha ' + str(_k + 1) + ' — compare caractere por caractere, inclusive os acentos.'
                                break
            else:
                _esp = eval(_t['esperado'], {})
                _item['esperado'] = repr(_esp)
                _buf = io.StringIO()
                with contextlib.redirect_stdout(_buf):
                    _obt = eval(_t['chamada'], _amb)
                _item['obtido'] = repr(_obt)
                _item['ok'] = (_obt == _esp)
                if not _item['ok'] and type(_obt) is not type(_esp):
                    _item['detalhe'] = 'O valor é de outro tipo: esperava ' + type(_esp).__name__ + ' e recebeu ' + type(_obt).__name__ + '.'
        except BaseException as _e:
            _item['erro'] = ''.join(traceback.format_exception_only(type(_e), _e)).strip()
            _item['obtido'] = '—'
        _resultados.append(_item)
    return json.dumps({'erro': None, 'impresso': _saida.getvalue(), 'testes': _resultados})
`;

async function ligar(){
  let ultimo = null;
  for (const base of BUILDS){
    try{
      avisar("estado", { texto: "baixando o Python…" });
      const mod = await import(base + "pyodide.mjs");
      py = await mod.loadPyodide({ indexURL: base });
      py.setStdout({ batched: (t) => avisar("linha", { texto: t, fluxo: "out" }) });
      py.setStderr({ batched: (t) => avisar("linha", { texto: t, fluxo: "err" }) });
      py.runPython(PREPARO);
      avisar("pronto", { versao: py.runPython("import sys; sys.version.split()[0]") });
      return;
    }catch(e){ ultimo = e; py = null; }
  }
  avisar("falha", { texto: String((ultimo && ultimo.message) || ultimo || "motivo desconhecido") });
}

self.onmessage = async (ev) => {
  const msg = ev.data;

  if (msg.tipo === "ligar"){ prontoPromise = ligar(); await prontoPromise; return; }

  if (prontoPromise) { await prontoPromise; }
  if (!py){ avisar("fim", { id: msg.id, erro: "O motor Python nao esta disponivel." }); return; }

  if (msg.tipo === "rodar"){
    try{
      try{ await py.loadPackagesFromImports(msg.codigo); }catch(e){}
      const fn = py.globals.get("_executar");
      const erro = fn(msg.codigo);
      fn.destroy();
      avisar("fim", { id: msg.id, erro: erro || null });
    }catch(e){ avisar("fim", { id: msg.id, erro: String((e && e.message) || e) }); }
    return;
  }

  if (msg.tipo === "corrigir"){
    try{
      try{ await py.loadPackagesFromImports(msg.codigo); }catch(e){}
      const fn = py.globals.get("_corrigir");
      const bruto = fn(msg.codigo, msg.testes);
      fn.destroy();
      avisar("resultado", { id: msg.id, dados: bruto });
    }catch(e){ avisar("resultado", { id: msg.id, dados: JSON.stringify({ erro: String((e && e.message) || e), impresso: "", testes: [] }) }); }
  }
};

function normalizarTexto(t){

async function sha256(txt){
  var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
  return Array.from(new Uint8Array(buf)).map(function(b){
    return b.toString(16).padStart(2,"0");
  }).join("");
}

/* Destaque de sintaxe estático, para os blocos de leitura */
function pintar(codigo){
  var PALAVRAS = ["and","as","assert","break","class","continue","def","del","elif","else",
    "except","False","finally","for","from","global","if","import","in","is","lambda","None",
    "not","or","pass","raise","return","True","try","while","with","yield"];
  var EMBUTIDAS = ["print","len","type","int","str","float","list","dict","range","sum","sorted",
    "enumerate","input","abs","round","min","max","bool","set","tuple","open","zip"];

  var partes = [];
  var resto = String(codigo);
  var padrao = /(#[^\n]*)|(f?"(?:[^"\\]|\\.)*")|(f?'(?:[^'\\]|\\.)*')|(\b\d+\.?\d*\b)|([A-Za-z_][A-Za-z0-9_]*)/g;
  var pos = 0, m;

  while ((m = padrao.exec(resto)) !== null){
    partes.push(esc(resto.slice(pos, m.index)));
    var t = m[0];
    if (m[1]) partes.push('<span class="tk-com">' + esc(t) + "</span>");
    else if (m[2] || m[3]) partes.push('<span class="tk-str">' + esc(t) + "</span>");
    else if (m[4]) partes.push('<span class="tk-num">' + esc(t) + "</span>");
    else if (PALAVRAS.indexOf(t) >= 0) partes.push('<span class="tk-key">' + esc(t) + "</span>");
    else if (EMBUTIDAS.indexOf(t) >= 0) partes.push('<span class="tk-fun">' + esc(t) + "</span>");
    else partes.push(esc(t));
    pos = m.index + t.length;
  }
  partes.push(esc(resto.slice(pos)));
  return partes.join("");
}

var motor = {
  worker:null, pronto:false, ocupado:false,
  id:0, pendente:null, tempo:null, versao:"—"
};

function estadoMotor(chave, texto){
  document.body.dataset.motor = chave;
  $("notaTopo").textContent = texto;
}

function ligarMotor(){
  var fonte = $("fonteWorker").textContent;
  var url = URL.createObjectURL(new Blob([fonte], { type:"text/javascript" }));

  try{
    motor.worker = new Worker(url, { type:"module" });
  }catch(e){
    estadoMotor("falha", "navegador sem suporte");
    return;
  }

  motor.worker.onmessage = function(ev){
    var m = ev.data;

    if (m.tipo === "estado"){ estadoMotor("carregando", m.texto); return; }

    if (m.tipo === "pronto"){
      motor.pronto = true; motor.versao = m.versao;
      estadoMotor("pronto", "pronto");
      $("diagMotor").textContent = "motor: Python " + m.versao;
      document.dispatchEvent(new Event("motor-pronto"));
      return;
    }

    if (m.tipo === "falha"){
      estadoMotor("falha", "motor indisponível");
      $("diagMotor").textContent = "motor: falhou";
      return;
    }

    if (m.tipo === "linha"){
      if (motor.pendente && motor.pendente.imprimir) motor.pendente.imprimir(m.texto, m.fluxo);
      return;
    }

    if (m.tipo === "fim" || m.tipo === "resultado"){
      if (!motor.pendente || m.id !== motor.pendente.id) return;
      var p = motor.pendente;
      encerrarChamada();
      if (m.tipo === "fim") p.resolver({ erro: m.erro || null });
      else p.resolver(JSON.parse(m.dados));
    }
  };

  motor.worker.onerror = function(){ estadoMotor("falha", "erro no motor"); };
  motor.worker.postMessage({ tipo:"ligar" });
}

function encerrarChamada(){
  clearTimeout(motor.tempo);
  motor.pendente = null;
  motor.ocupado = false;
  if (motor.pronto) estadoMotor("pronto", "pronto");
}

function chamarMotor(msg, aoImprimir){
  return new Promise(function(resolver, rejeitar){
    if (!motor.pronto){ rejeitar(new Error("O motor Python ainda não está pronto.")); return; }
    if (motor.ocupado){ rejeitar(new Error("Há algo sendo executado agora.")); return; }

    motor.ocupado = true;
    motor.id += 1;
    motor.pendente = { id: motor.id, resolver: resolver, rejeitar: rejeitar, imprimir: aoImprimir };
    estadoMotor("rodando", "executando…");

    motor.tempo = setTimeout(function(){ derrubarMotor(); }, CONFIG.limiteMs);
    motor.worker.postMessage(Object.assign({ id: motor.id }, msg));
  });
}

function derrubarMotor(){
  var p = motor.pendente;
  motor.worker.terminate();
  motor.pronto = false;
  motor.pendente = null;
  motor.ocupado = false;
  clearTimeout(motor.tempo);
  estadoMotor("carregando", "religando…");
  ligarMotor();
  if (p) p.rejeitar(new Error("TEMPO"));
}

var editor = null;

function criarEditor(alvo, valor){
  if (window.CodeMirror){
    var ta = document.createElement("textarea");
    alvo.appendChild(ta);
    var cm = CodeMirror.fromTextArea(ta, {
      mode:"python", theme:"vidas", lineNumbers:true,
      indentUnit:4, tabSize:4, indentWithTabs:false,
      styleActiveLine:true, lineWrapping:true, smartIndent:true,
      viewportMargin: Infinity,
      extraKeys:{ Tab: function(c){ c.replaceSelection("    "); } }
    });
    cm.setValue(valor || "");
    cm.on("beforeChange", function(inst, mudanca){
      if (!mudanca.text || !mudanca.update) return;
      var alterou = false;
      var limpo = mudanca.text.map(function(linha){
        var n = normalizarTexto(linha);
        if (n !== linha) alterou = true;
        return n;
      });
      if (alterou) mudanca.update(mudanca.from, mudanca.to, limpo);
    });
    editor = {
      cm: cm,
      ler: function(){ return cm.getValue(); },
      escrever: function(v){ cm.setValue(v); },
      inserir: function(t, volta){
        cm.replaceSelection(t);
        if (volta){
          var p = cm.getCursor();
          cm.setCursor({ line:p.line, ch:p.ch - volta });
        }
        cm.focus();
      },
      mover: function(dx, dy){
        var p = cm.getCursor();
        if (dy) cm.setCursor({ line: Math.max(0, p.line + dy), ch: p.ch });
        else cm.setCursor({ line: p.line, ch: Math.max(0, p.ch + dx) });
        cm.focus();
      },
      focar: function(){ cm.focus(); }
    };
  } else {
    var t2 = document.createElement("textarea");
    t2.className = "simples";
    t2.spellcheck = false;
    t2.setAttribute("autocapitalize","off");
    t2.setAttribute("autocorrect","off");
    t2.value = valor || "";
    alvo.appendChild(t2);
    t2.addEventListener("keydown", function(e){
      if (e.key === "Tab"){ e.preventDefault(); editor.inserir("    "); }
    });
    t2.addEventListener("input", function(){
      var limpo = normalizarTexto(t2.value);
      if (limpo !== t2.value){
        var p = t2.selectionStart;
        t2.value = limpo;
        t2.selectionStart = t2.selectionEnd = p;
      }
    });
    editor = {
      ler: function(){ return t2.value; },
      escrever: function(v){ t2.value = v; },
      inserir: function(txt, volta){
        var i = t2.selectionStart, f = t2.selectionEnd;
        t2.value = t2.value.slice(0,i) + txt + t2.value.slice(f);
        var novo = i + txt.length - (volta || 0);
        t2.selectionStart = t2.selectionEnd = novo;
        t2.focus();
      },
      mover: function(dx){
        var p = t2.selectionStart + dx;
        t2.selectionStart = t2.selectionEnd = Math.max(0, p);
        t2.focus();
      },
      focar: function(){ t2.focus(); }
    };
  }
  return editor;
}

function tipoDoErro(bruto){
  var linhas = String(bruto).trim().split("\n");
  var ultima = linhas[linhas.length - 1] || "";
  var m = ultima.match(/^([A-Za-z_]+Error)\b/);
  return m ? m[1] : null;
}

function traduzirErro(bruto){
  return String(bruto).replace("Traceback (most recent call last):", "Rastreamento (a última chamada é a de baixo):");

var estado = { modulos:[], modulo:null, aberto:0, progresso:{}, licao:null, indice:0, tentativas:0, respondido:false };

function exerciciosFeitos(licao){
  var n = 0;
  licao.exercicios.forEach(function(ex){
    if (estado.progresso[licao.id + "/" + ex.id]) n++;
  });
  return n;
}
function licaoCompleta(licao){
  return exerciciosFeitos(licao) === licao.exercicios.length;
}
function moduloCompleto(mod){
  return mod.licoes.every(licaoCompleta);
}
function contarModulo(mod){
  var feitos = 0, total = 0;
  mod.licoes.forEach(function(l){ feitos += exerciciosFeitos(l); total += l.exercicios.length; });
  return { feitos: feitos, total: total };
}

function telaTrilha(){

  for (var j = 0; j < estado.modulos.length; j++){
    if (!moduloCompleto(estado.modulos[j])){ padrao = j; break; }
  }
  if (estado.aberto === null) estado.aberto = padrao;

    var c = contarModulo(mod);
    var anterior = m === 0 ? null : estado.modulos[m-1];
    var travado = anterior ? !moduloCompleto(anterior) : false;
    var completo = c.feitos === c.total;
    var aberto = (m === estado.aberto) && !travado;

      "</button>";

    if (aberto){
      h += '<div class="licoes">';
      mod.licoes.forEach(function(licao, i){
        var feitos = exerciciosFeitos(licao);
        var total = licao.exercicios.length;
        var trava = i === 0 ? false : !licaoCompleta(mod.licoes[i-1]);
        var est = feitos === total ? "concluida" : (feitos > 0 ? "andamento" : "aberta");

        h += '<button class="cartao" data-estado="' + est + '" data-mod="' + m + '" data-licao="' + licao.id + '"' +
             (trava ? " disabled" : "") + ">" +
          '<span class="numero">Lição ' + licao.numero + "</span>" +
          "<h3>" + esc(licao.titulo) + "</h3>" +
          "<p>" + esc(licao.resumo) + "</p>" +
          '<div class="barra"><i style="width:' + Math.round(feitos/total*100) + '%"></i></div>' +
          '<div class="rodape"><span>' + feitos + " de " + total + " exercícios</span><span>" +
            (trava ? "conclua a anterior" : (feitos === total ? "concluída" : (feitos > 0 ? "em andamento" : "começar"))) +
          "</span></div></button>";
      });
      h += "</div>";
    }
    h += "</div>";
  });

  if (CONFIG.emBreve && CONFIG.emBreve.length){
    h += '<div class="futuro"><span>ainda por escrever</span><ul>';
    CONFIG.emBreve.forEach(function(t, k){
      h += "<li>Módulo " + (estado.modulos.length + k + 1) + " — " + esc(t) + "</li>";
    });
    h += "</ul></div>";
  }

  h += "</div>";
  app.innerHTML = h;
  app.scrollTop = 0;

  Array.prototype.forEach.call(app.querySelectorAll(".cabeca-modulo"), function(b){
    b.addEventListener("click", function(){
      var m = Number(b.dataset.mod);
      estado.aberto = (estado.aberto === m) ? -1 : m;
      telaTrilha();
    });
  });

  Array.prototype.forEach.call(app.querySelectorAll(".cartao"), function(b){
    b.addEventListener("click", function(){
      var mod = estado.modulos[Number(b.dataset.mod)];
      var alvo = mod.licoes.filter(function(l){ return l.id === b.dataset.licao; })[0];
      estado.modulo = mod;
      abrirLicao(alvo);
    });
  });
}

/* =======================================================================
   Tela: lição
   ======================================================================= */
function abrirLicao(licao){
  estado.licao = licao;
  $("btnVoltar").style.display = "block";
  $("tituloTopo").textContent = licao.titulo;
  telaConceito();
}

function passos(ativo){
  var nomes = [["conceito","Conceito"],["lab","Laboratório"],["exerc","Exercícios"]];
  var h = '<div class="passos" role="tablist">';
  nomes.forEach(function(n){
    h += '<button role="tab" data-passo="' + n[0] + '" aria-selected="' + (n[0]===ativo) + '">' + n[1] + "</button>";
  });
  return h + "</div>";
}

function ligarPassos(){
  Array.prototype.forEach.call(app.querySelectorAll(".passos button"), function(b){
    b.addEventListener("click", function(){
      var p = b.dataset.passo;
      if (p === "conceito") telaConceito();
      else if (p === "lab") telaLaboratorio();
      else telaExercicio(0);
    });
  });
}

function telaConceito(){
  var licao = estado.licao;
  var h = '<div class="folha">' + passos("conceito") +
    '<h2 class="secao">' + esc(licao.titulo) + "</h2>" +
    '<p class="legenda">' + esc(licao.resumo) + "</p>";

  licao.conceito.forEach(function(b, i){
    if (b.tipo === "texto"){
      h += '<p class="bloco-texto">' + esc(b.conteudo) + "</p>";
    } else if (b.tipo === "aviso"){
      h += '<div class="bloco-aviso">' + esc(b.conteudo) + "</div>";
    } else if (b.tipo === "codigo"){
      h += '<div class="exemplo" data-ex="' + i + '">' +
             "<pre>" + pintar(b.conteudo) + "</pre>" +
             (b.nota ? '<div class="nota">' + esc(b.nota) + "</div>" : "") +
             '<div class="barra-exemplo"><button class="mini" data-rodar="' + i + '">executar</button></div>' +
           "</div>";
    }
  });

  h += '<div class="acoes" style="margin-top:26px">' +
         '<button class="acao principal" id="irLab">Ir ao laboratório</button>' +
       "</div></div>";

  app.innerHTML = h;
  app.scrollTop = 0;
  ligarPassos();
  $("irLab").addEventListener("click", telaLaboratorio);

  Array.prototype.forEach.call(app.querySelectorAll("[data-rodar]"), function(b){
    b.addEventListener("click", async function(){
      var i = Number(b.dataset.rodar);
      var caixa = app.querySelector('.exemplo[data-ex="' + i + '"]');
      var pre = caixa.querySelector(".mini-saida");
      if (!pre){
        pre = document.createElement("pre");
        caixa.appendChild(pre);
      }
      pre.className = "mini-saida";
      pre.textContent = "…";

      var linhas = [];
      try{
        var r = await chamarMotor({ tipo:"rodar", codigo: licao.conceito[i].conteudo },
          function(t){ linhas.push(t); });
        if (r.erro){ pre.className = "mini-saida ruim"; pre.textContent = traduzirErro(r.erro).trim(); }
        else pre.textContent = linhas.join("").replace(/\n$/,"") || "(sem saída)";
      }catch(e){
        pre.className = "mini-saida ruim";
        pre.textContent = e.message === "TEMPO" ? "Execução interrompida: passou de 6 segundos." : e.message;
      }
    });
  });
}

function telaLaboratorio(){
  var licao = estado.licao;
  var lab = licao.laboratorio;

  app.innerHTML = '<div class="folha">' + passos("lab") +
    '<h2 class="secao">Laboratório</h2>' +
    '<p class="legenda">' + esc(lab.instrucao) + "</p>" +
    '<div class="moldura"><div class="cabeca"><span>codigo.py</span><span>livre</span></div>' +
      '<div id="alvoEditor"></div></div>' +
    '<div class="acoes">' +
      '<button class="acao principal" id="btnRodar">Executar</button>' +
      '<button class="acao discreta" id="btnRestaurar">Restaurar</button>' +
      '<button class="acao espaco" id="irExerc">Ir aos exercícios</button>' +
    "</div>" +
    '<div class="saida-caixa"><span>saída</span><pre id="saida"><span class="vazio">Clique em Executar.</span></pre></div>' +
    "</div>";

  app.scrollTop = 0;
  ligarPassos();

  var alvo = $("alvoEditor");
  criarEditor(alvo, lab.codigo);
  montarSimbolos(alvo.parentNode);

  $("btnRestaurar").addEventListener("click", function(){ editor.escrever(lab.codigo); });
  $("irExerc").addEventListener("click", function(){ telaExercicio(0); });
  $("btnRodar").addEventListener("click", async function(){
    var saida = $("saida");
    saida.textContent = "…";
    var linhas = [];
    try{
      var r = await chamarMotor({ tipo:"rodar", codigo: editor.ler() },
        function(t, f){ linhas.push({ t:t, f:f }); });
      saida.innerHTML = "";
      linhas.forEach(function(l){
        var s = document.createElement("span");
        if (l.f === "err") s.className = "err";
        s.textContent = l.t.replace(/\n$/,"") + "\n";
        saida.appendChild(s);
      });
      if (r.erro){
        var e = document.createElement("span");
        e.className = "err";
        e.textContent = traduzirErro(r.erro).trim();
        saida.appendChild(e);
        var tipo = tipoDoErro(r.erro);
        if (tipo && DICAS[tipo]){
          var g = document.createElement("div");
          g.className = "glosa";
          g.textContent = DICAS[tipo];
          saida.appendChild(g);
        }
      } else if (!linhas.length){
        saida.innerHTML = '<span class="vazio">Rodou sem erro, mas não imprimiu nada. Use print() para ver algum resultado.</span>';
      }
    }catch(e){
      saida.innerHTML = "";
      var s2 = document.createElement("span");
      s2.className = "err";
      s2.textContent = e.message === "TEMPO"
        ? "Execução interrompida após 6 segundos. Quase sempre é um laço que nunca chega à condição de parada."
        : e.message;
      saida.appendChild(s2);
    }
  });
}

/* =======================================================================
   Tela: exercício
   ======================================================================= */
function telaExercicio(i){
  var licao = estado.licao;
  if (i >= licao.exercicios.length){ telaFim(); return; }

  estado.indice = i;
  estado.tentativas = 0;
  estado.respondido = false;

  var ex = licao.exercicios[i];
  var jaFeito = !!estado.progresso[licao.id + "/" + ex.id];

  var h = '<div class="folha">' + passos("exerc");

  h += '<div class="pontos">';
  licao.exercicios.forEach(function(o, k){
    var cls = k === i ? "atual" : (estado.progresso[licao.id + "/" + o.id] ? "feito" : "");
    h += '<i class="' + cls + '"></i>';
  });
  h += "<em>" + (i+1) + " de " + licao.exercicios.length + "</em></div>";

  h += '<p class="enunciado">' + esc(ex.enunciado) + "</p>";

  if (ex.codigo) h += '<div class="exemplo"><pre>' + pintar(ex.codigo) + "</pre></div>";

  if (ex.tipo === "escolha"){
    h += '<div id="opcoes">';
    ex.opcoes.forEach(function(o, k){
      h += '<button class="opcao" data-op="' + k + '" aria-pressed="false">' + esc(o) + "</button>";
    });
    h += "</div>";
  } else {
    if (ex.mostraEsperado && ex.esperado){
      h += '<div class="esperado-caixa"><span>saída esperada</span><pre>' + esc(ex.esperado) + "</pre></div>";
    }
    h += '<div class="moldura"><div class="cabeca"><span>codigo.py</span><span>exercício ' + (i+1) + "</span></div>" +
         '<div id="alvoEditor"></div></div>';
  }

  h += '<div class="acoes" id="acoes">' +
       '<button class="acao principal" id="btnVerificar">Verificar</button>';
  if (ex.tipo === "codigo") h += '<button class="acao discreta" id="btnTestar">Só executar</button>';
  h += '<button class="acao discreta espaco" id="btnPular">Pular</button>' +
       "</div>";

  h += '<div id="retorno"></div></div>';

  app.innerHTML = h;
  app.scrollTop = 0;
  ligarPassos();

  var escolhida = -1;

  if (ex.tipo === "escolha"){
    Array.prototype.forEach.call(app.querySelectorAll(".opcao"), function(b){
      b.addEventListener("click", function(){
        if (estado.respondido) return;
        escolhida = Number(b.dataset.op);
        Array.prototype.forEach.call(app.querySelectorAll(".opcao"), function(o){
          o.setAttribute("aria-pressed", o === b ? "true" : "false");
        });
      });
    });
  } else {
    var alvo = $("alvoEditor");
    criarEditor(alvo, ex.inicial || "");
    montarSimbolos(alvo.parentNode);
    $("btnTestar").addEventListener("click", executarSolto);
  }

  $("btnPular").addEventListener("click", function(){ telaExercicio(i + 1); });
  $("btnVerificar").addEventListener("click", function(){
    if (ex.tipo === "escolha") verificarEscolha(escolhida);
    else verificarCodigo();
  });

  if (jaFeito){
    mostrarRetorno("bom", "Já concluído", "Você acertou este exercício antes. Pode refazer ou seguir adiante.", null, true);
  }

  /* ---- verificação: múltipla escolha ---- */
  function verificarEscolha(k){
    if (k < 0){
      mostrarRetorno("mau", "Escolha uma opção", "Toque numa das alternativas antes de verificar.", null, false);
      return;
    }
    estado.tentativas += 1;
    var certo = k === ex.correta;
    gravarTentativa(licao.id, ex.id, "opção " + (k+1), certo, null);

    Array.prototype.forEach.call(app.querySelectorAll(".opcao"), function(o, idx){
      o.disabled = certo;
      if (idx === k) o.classList.add(certo ? "certa" : "errada");
      if (certo && idx === ex.correta) o.classList.add("certa");
    });

    if (certo){
      estado.respondido = true;
      estado.progresso[licao.id + "/" + ex.id] = true;
      gravarAcerto(licao.id, ex.id, estado.tentativas);
      mostrarRetorno("bom", "Correto", ex.explicacao, null, true);
    } else {
      mostrarRetorno("mau", "Ainda não", "Essa não é a alternativa certa. Releia o código com calma e tente de novo.", null, false);
    }
  }

  /* ---- executar sem corrigir ---- */
  async function executarSolto(){
    var linhas = [];
    try{
      var r = await chamarMotor({ tipo:"rodar", codigo: editor.ler() }, function(t){ linhas.push(t); });
      var txt = linhas.join("").replace(/\n$/,"");
      if (r.erro) mostrarRetorno("mau", "Erro ao executar", null, traduzirErro(r.erro).trim(), false, tipoDoErro(r.erro));
      else mostrarRetorno("bom", "Executou", txt ? "Saída do seu código:" : "Rodou sem erro e sem imprimir nada.", txt, false);
    }catch(e){
      mostrarRetorno("mau", "Interrompido", e.message === "TEMPO"
        ? "Passou de 6 segundos sem terminar. Verifique se há um laço sem condição de parada."
        : e.message, null, false);
    }
  }

  /* ---- verificação: código ---- */
  async function verificarCodigo(){
    var codigo = editor.ler();
    if (!codigo.trim()){
      mostrarRetorno("mau", "Editor vazio", "Escreva o código antes de verificar.", null, false);
      return;
    }
    estado.tentativas += 1;

    var testes = ex.verificacao === "saida"
      ? [{ tipo:"saida", rotulo:"saída do programa", esperado: ex.esperado }]
      : (ex.testes || []);

    var r;
    try{
      r = await chamarMotor({ tipo:"corrigir", codigo: codigo, testes: JSON.stringify(testes) });
    }catch(e){
      mostrarRetorno("mau", "Interrompido", e.message === "TEMPO"
        ? "Passou de 6 segundos sem terminar. Verifique se há um laço sem condição de parada."
        : e.message, null, false);
      return;
    }

    if (r.erro){
      gravarTentativa(licao.id, ex.id, codigo, false, r.erro);
      mostrarRetorno("mau", "O código não chegou ao fim", null, traduzirErro(r.erro).trim(), false, tipoDoErro(r.erro));
      return;
    }

    var todos = r.testes.length > 0 && r.testes.every(function(t){ return t.ok; });
    gravarTentativa(licao.id, ex.id, codigo, todos, null);

    if (todos){
      estado.respondido = true;
      estado.progresso[licao.id + "/" + ex.id] = true;
      gravarAcerto(licao.id, ex.id, estado.tentativas);
      mostrarRetorno("bom", "Correto", "Todas as verificações passaram.", null, true, null, r.testes);
    } else {
      mostrarRetorno("mau", "Quase lá", "Compare com atenção o esperado e o obtido:", null, false, null, r.testes);
    }
  }

  /* ---- painel de retorno ---- */
  function mostrarRetorno(tom, titulo, texto, bruto, avancar, tipoErro, testes){
    var alvo = $("retorno");
    var h = '<div class="retorno ' + (tom === "bom" ? "bom" : "mau") + '">' +
            "<h4>" + esc(titulo) + "</h4>";
    if (texto) h += "<p>" + esc(texto) + "</p>";
    if (bruto) h += "<pre>" + esc(bruto) + "</pre>";
    if (tipoErro && DICAS[tipoErro]) h += '<div class="glosa">' + esc(DICAS[tipoErro]) + "</div>";

    if (testes && testes.length){
      h += '<table class="testes"><tr><th></th><th>verificação</th><th>esperado</th><th>obtido</th></tr>';
      testes.forEach(function(t){
        h += '<tr class="' + (t.ok ? "ok" : "nao") + '">' +
             '<td class="marca">' + (t.ok ? "✓" : "✗") + "</td>" +
             "<td>" + esc(t.rotulo) + "</td>" +
             "<td>" + esc(t.esperado) + "</td>" +
             '<td class="obtido">' + esc(t.erro ? t.erro : t.obtido) + "</td></tr>";
      });
      h += "</table>";
      testes.forEach(function(t){
        if (!t.ok && t.detalhe) h += '<div class="glosa">' + esc(t.detalhe) + "</div>";
      });
    }
    h += "</div>";

    h += '<div class="acoes">';
    if (avancar){
      h += '<button class="acao principal" id="btnProximo">' +
           (i + 1 >= licao.exercicios.length ? "Concluir lição" : "Próximo exercício") + "</button>";
    } else {
      if (estado.tentativas >= 2 && ex.dica) h += '<button class="acao" id="btnDica">Ver dica</button>';
      if (estado.tentativas >= 3 && ex.solucao) h += '<button class="acao discreta" id="btnSolucao">Ver solução</button>';
    }
    h += "</div>";

    alvo.innerHTML = h;

    if ($("btnProximo")) $("btnProximo").addEventListener("click", function(){ telaExercicio(i + 1); });
    if ($("btnDica")) $("btnDica").addEventListener("click", function(){
      $("btnDica").outerHTML = '<div class="glosa" style="width:100%">' + esc(ex.dica) + "</div>";
    });
    if ($("btnSolucao")) $("btnSolucao").addEventListener("click", function(){
      editor.escrever(ex.solucao);
      $("btnSolucao").outerHTML = '<div class="glosa" style="width:100%">A solução foi escrita no editor. Leia com calma, execute, e depois apague e escreva do seu jeito.</div>';
    });

    alvo.scrollIntoView({ behavior:"smooth", block:"nearest" });
  }
}

/* =======================================================================
   Tela: conclusão
   ======================================================================= */
function telaFim(){
  var licao = estado.licao;
  var feitos = exerciciosFeitos(licao);
  var total = licao.exercicios.length;
  var completa = feitos === total;

  app.innerHTML = '<div class="folha"><div class="fim">' +
    '<div class="selo">' + (completa ? "✦" : "◈") + "</div>" +
    "<h3>" + (completa ? "Lição concluída" : "Fim dos exercícios") + "</h3>" +
    "<p>" + (completa
      ? "Você acertou os " + total + " exercícios de " + esc(licao.titulo) + "."
      : "Você acertou " + feitos + " de " + total + ". Os que ficaram para trás continuam abertos.") + "</p>" +
    '<div class="acoes" style="justify-content:center">' +
      (completa ? "" : '<button class="acao" id="btnRefazer">Refazer os que faltam</button>') +
      '<button class="acao principal" id="btnTrilha">Voltar à trilha</button>' +
    "</div></div></div>";

  app.scrollTop = 0;
  $("btnTrilha").addEventListener("click", telaTrilha);
  if ($("btnRefazer")) $("btnRefazer").addEventListener("click", function(){
    for (var k = 0; k < licao.exercicios.length; k++){
      if (!estado.progresso[licao.id + "/" + licao.exercicios[k].id]){ telaExercicio(k); return; }
    }
  });
}

/* =======================================================================
   Arranque
   ======================================================================= */
function aviso(texto){
  var f = el('<div class="faixa">' + esc(texto) + "</div>");
  document.querySelector("header").insertAdjacentElement("afterend", f);
}

async function entrar(){
  try{
    estado.progresso = await lerProgresso();
  }catch(e){
    console.warn("progresso:", e);
    estado.progresso = {};
  }
  telaTrilha();
}

async function iniciar(){
  ligarMotor();

  if ("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(function(e){ console.warn("sw:", e); });
  }

  app.innerHTML = '<div class="folha"><p class="legenda">Carregando a trilha…</p></div>';

  /* Conteúdo do curso */
  try{
    var respostas = await Promise.all(CONFIG.modulos.map(async function(caminho){
      var r = await fetch(caminho, { cache:"no-cache" });
      if (!r.ok) throw new Error(caminho + " — HTTP " + r.status);
      return r.json();
    }));
    estado.modulos = respostas;
    estado.aberto = null;
  }catch(e){
    app.innerHTML = '<div class="folha"><h2 class="secao">Não achei o conteúdo</h2>' +
      '<p class="legenda">Um arquivo do curso não foi carregado. ' +
      'Confirme que a pasta <code>curso</code> está no repositório e que você está abrindo pelo GitHub Pages, não pelo Finder.</p>' +
      '<div class="exemplo"><pre>' + esc(e.message) + "</pre></div></div>";
    return;
  }

  /* Banco */
  var perfil = null;
  try{
    perfil = await lerPerfil();
    banco.ativo = true;
    $("diagBanco").textContent = "banco: conectado";
  }catch(e){
    banco.ativo = false;
    banco.motivo = e.message;
    $("diagBanco").textContent = "banco: offline";
    console.warn("supabase:", e);
    aviso("Sem conexão com o banco. Você pode estudar normalmente, mas o progresso não será guardado.");
    estado.progresso = {};
    telaTrilha();
    return;
  }

  telaPin(perfil);
}

$("btnVoltar").addEventListener("click", function(){
  if (estado.licao) telaTrilha();
});

document.addEventListener("keydown", function(e){
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)){
    var b = $("btnVerificar") || $("btnRodar");
    if (b) { e.preventDefault(); b.click(); }
  }
});

iniciar();

})();
</script>
